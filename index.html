<body>

  <!-- Stlite Mountable JS -->
  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.75.0/build/stlite.js"></script>
  <script>
    const embeddedFiles = { "app.py": "\"\"\"Taiwan Weather Forecast - Interactive Weather Analytics Web Application.\n\nCentral Weather Administration (CWA) Open Data API x Python x SQLite x Streamlit.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport datetime\nimport logging\nfrom typing import Optional, Tuple\n\nimport pandas as pd\nimport plotly.graph_objects as go\nimport streamlit as st\nfrom streamlit_folium import st_folium\n\nimport config\nimport database\nimport data_processor\nimport map_utils\nimport weather_api\n\n# Setup logging\nlogging.basicConfig(level=logging.INFO)\nlogger = logging.getLogger(__name__)\n\n# Streamlit Page Config\nst.set_page_config(\n    page_title=\"Taiwan Weather Forecast | 臺灣氣象預報儀表板\",\n    page_icon=\"🌤️\",\n    layout=\"wide\",\n    initial_sidebar_state=\"expanded\",\n)\n\n# Custom Styling (Clean Blue-White Tech Card UI)\nCUSTOM_CSS = \"\"\"\n<style>\n    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');\n\n    html, body, [class*=\"css\"] {\n        font-family: 'Inter', 'Noto Sans TC', sans-serif;\n    }\n\n    .main-header {\n        background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%);\n        padding: 24px 32px;\n        border-radius: 16px;\n        color: white;\n        margin-bottom: 24px;\n        box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.25);\n    }\n    .main-header h1 {\n        margin: 0;\n        font-size: 2.2rem;\n        font-weight: 700;\n        letter-spacing: -0.5px;\n    }\n    .main-header p {\n        margin: 8px 0 0 0;\n        font-size: 1.05rem;\n        opacity: 0.9;\n    }\n\n    /* Metric Cards */\n    .metric-card {\n        background: white;\n        border: 1px solid #E2E8F0;\n        border-radius: 14px;\n        padding: 20px;\n        text-align: center;\n        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);\n        transition: transform 0.2s ease, box-shadow 0.2s ease;\n    }\n    .metric-card:hover {\n        transform: translateY(-3px);\n        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);\n    }\n    .metric-icon {\n        font-size: 2rem;\n        margin-bottom: 8px;\n    }\n    .metric-label {\n        font-size: 0.9rem;\n        font-weight: 600;\n        color: #64748B;\n        text-transform: uppercase;\n        letter-spacing: 0.5px;\n    }\n    .metric-value {\n        font-size: 1.85rem;\n        font-weight: 700;\n        color: #0F172A;\n        margin: 4px 0;\n    }\n\n    /* Section Headers */\n    .section-title {\n        font-size: 1.3rem;\n        font-weight: 700;\n        color: #1E293B;\n        margin-top: 20px;\n        margin-bottom: 12px;\n        display: flex;\n        align-items: center;\n        gap: 8px;\n    }\n\n    /* St.button style */\n    div.stButton > button:first-child {\n        background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);\n        color: white;\n        border-radius: 8px;\n        padding: 0.5rem 1rem;\n        font-weight: 600;\n        border: none;\n        box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);\n        width: 100%;\n    }\n    div.stButton > button:first-child:hover {\n        background: linear-gradient(135deg, #1D4ED8 0%, #1E40AF 100%);\n    }\n</style>\n\"\"\"\nst.markdown(CUSTOM_CSS, unsafe_allow_html=True)\n\n\n# Database Initialization & Data Loading Helpers\n@st.cache_resource\ndef ensure_database_initialized() -> None:\n    \"\"\"Ensure database schema exists on application start.\"\"\"\n    try:\n        database.init_database()\n    except Exception as exc:\n        logger.error(\"Database initialization failed: %s\", exc)\n        st.error(\"資料庫初始化失敗，請確認檔案讀寫權限。\")\n\n\ndef fetch_and_save_weather() -> Tuple[bool, str]:\n    \"\"\"Fetch data from CWA API and persist to SQLite.\n\n    Updates both 36h forecast (F-C0032-001) and real-time station observations (O-A0003-001).\n\n    Returns:\n        Tuple[bool, str]: Success flag and status message.\n    \"\"\"\n    api_key = config.get_api_key()\n    if not api_key:\n        return False, \"尚未設定 CWA API Key，請先設定 secrets.toml 或 .env 檔案。\"\n\n    try:\n        # 1. Fetch & Store 36h Forecasts\n        fc_json = weather_api.get_forecast_data(api_key=api_key)\n        df_fc = data_processor.parse_forecast_json(fc_json)\n        database.insert_weather_data(df_fc, table_name=\"TemperatureForecasts\")\n\n        # 2. Fetch & Store Real-time Observations (363 Stations)\n        try:\n            obs_json = weather_api.get_observation_data(api_key=api_key)\n            df_obs = data_processor.parse_observation_json(obs_json)\n            database.insert_weather_data(df_obs, table_name=\"StationObservations\")\n        except Exception as obs_err:\n            logger.warning(\"Observation update warning: %s\", obs_err)\n\n        # Clear cached queries so dashboard refreshes\n        load_weather_data.clear()\n        load_observations.clear()\n        return True, \"天氣資料更新成功！\"\n    except weather_api.WeatherAPIError as exc:\n        return False, str(exc)\n    except Exception as exc:\n        logger.error(\"Unexpected update failure: %s\", exc)\n        return False, f\"更新過程發生錯誤：{exc}\"\n\n\n@st.cache_data(ttl=600)\ndef load_weather_data(region_name: Optional[str] = None) -> pd.DataFrame:\n    \"\"\"Load weather forecast records from SQLite with caching.\"\"\"\n    try:\n        if region_name:\n            return database.query_weather_by_region(region_name)\n        return database.query_all_weather()\n    except Exception as exc:\n        logger.error(\"Database read error: %s\", exc)\n        st.error(\"資料庫讀取失敗。\")\n        return pd.DataFrame()\n\n\n@st.cache_data(ttl=600)\ndef load_observations(region_name: Optional[str] = None) -> pd.DataFrame:\n    \"\"\"Load station observations from SQLite with caching.\"\"\"\n    try:\n        return database.query_all_observations(region_name=region_name)\n    except Exception as exc:\n        logger.error(\"Observation read error: %s\", exc)\n        return pd.DataFrame()\n\n\ndef render_temperature_chart(df: pd.DataFrame, region_name: str) -> go.Figure:\n    \"\"\"Build an interactive Plotly temperature trend line chart.\"\"\"\n    fig = go.Figure()\n\n    if df.empty:\n        fig.add_annotation(\n            text=\"目前沒有溫度預報資料\",\n            xref=\"paper\",\n            yref=\"paper\",\n            showarrow=False,\n            font=dict(size=16, color=\"#64748B\"),\n        )\n        return fig\n\n    # Format x-axis labels: e.g. \"09/23 18:00 ~ 09/24 06:00\"\n    x_labels = []\n    for _, row in df.iterrows():\n        st_val = str(row[\"startTime\"])[5:16]  # MM-DD HH:MM\n        et_val = str(row[\"endTime\"])[5:16]\n        x_labels.append(f\"{st_val} ~ {et_val}\")\n\n    # Highest Temperature Line (MaxT)\n    fig.add_trace(\n        go.Scatter(\n            x=x_labels,\n            y=df[\"MaxT\"],\n            mode=\"lines+markers+text\",\n            name=\"最高溫 (MaxT)\",\n            line=dict(color=\"#EF4444\", width=3, shape=\"spline\"),\n            marker=dict(size=9, color=\"#DC2626\"),\n            text=[f\"{v:.0f}°C\" for v in df[\"MaxT\"]],\n            textposition=\"top center\",\n            hovertemplate=\"時段: %{x}<br>最高溫: %{y:.1f} °C<extra></extra>\",\n        )\n    )\n\n    # Lowest Temperature Line (MinT)\n    fig.add_trace(\n        go.Scatter(\n            x=x_labels,\n            y=df[\"MinT\"],\n            mode=\"lines+markers+text\",\n            name=\"最低溫 (MinT)\",\n            line=dict(color=\"#2563EB\", width=3, shape=\"spline\"),\n            marker=dict(size=9, color=\"#1D4ED8\"),\n            text=[f\"{v:.0f}°C\" for v in df[\"MinT\"]],\n            textposition=\"bottom center\",\n            hovertemplate=\"時段: %{x}<br>最低溫: %{y:.1f} °C<extra></extra>\",\n        )\n    )\n\n    # Styling Layout (Plotly 7.x compatible)\n    fig.update_layout(\n        title=dict(\n            text=f\"📈 {region_name} - 未來溫度預報折線圖\",\n            font=dict(size=18, color=\"#0F172A\"),\n        ),\n        xaxis=dict(\n            title=dict(\n                text=\"預報時段\",\n                font=dict(size=14, color=\"#475569\"),\n            ),\n            gridcolor=\"#F1F5F9\",\n            tickangle=-15,\n        ),\n        yaxis=dict(\n            title=dict(\n                text=\"溫度 (°C)\",\n                font=dict(size=14, color=\"#475569\"),\n            ),\n            gridcolor=\"#E2E8F0\",\n            zeroline=False,\n        ),\n        legend=dict(\n            orientation=\"h\",\n            yanchor=\"bottom\",\n            y=1.02,\n            xanchor=\"right\",\n            x=1,\n            font=dict(size=12),\n        ),\n        plot_bgcolor=\"#FFFFFF\",\n        paper_bgcolor=\"#FFFFFF\",\n        hovermode=\"x unified\",\n        margin=dict(l=40, r=40, t=60, b=60),\n    )\n    return fig\n\n\ndef main() -> None:\n    \"\"\"Main application lifecycle.\"\"\"\n    ensure_database_initialized()\n\n    # If database is completely empty on launch, attempt initial fetch automatically\n    df_check = load_weather_data()\n    if df_check.empty and config.get_api_key():\n        fetch_and_save_weather()\n\n    # ------------------ SIDEBAR ------------------\n    st.sidebar.markdown(\"## 🌤️ Weather Forecast\")\n    st.sidebar.markdown(\"---\")\n\n    # API Key Configuration (Essential for WebAssembly / Stlite deployment)\n    active_key = config.get_api_key()\n    if not active_key:\n        st.sidebar.markdown(\"### 🔑 API Key 設定\")\n        input_key = st.sidebar.text_input(\n            \"CWA API 授權碼\",\n            type=\"password\",\n            value=st.session_state.get(\"user_cwa_api_key\", \"\"),\n            placeholder=\"請輸入 CWA-XXXXXXXX...\",\n            help=\"若在瀏覽器 (stlite) 執行，請輸入中央氣象署 API 授權碼\",\n        )\n        if input_key:\n            st.session_state[\"user_cwa_api_key\"] = input_key.strip()\n            st.rerun()\n    else:\n        st.sidebar.caption(\"🔑 API 授權碼：已就緒\")\n\n    # 1. County Selection\n    selected_region = st.sidebar.selectbox(\n        \"📍 選擇台灣地區\",\n        options=config.TAIWAN_COUNTIES,\n        index=3,  # Default: 臺中市\n    )\n\n    # 2. Date Selection (derived from available dates in DB)\n    all_df = load_weather_data(selected_region)\n    available_dates = (\n        sorted(all_df[\"dataDate\"].unique().tolist())\n        if not all_df.empty\n        else [datetime.date.today().strftime(\"%Y-%m-%d\")]\n    )\n    selected_date = st.sidebar.selectbox(\n        \"📅 選擇日期\",\n        options=available_dates,\n        index=0,\n    )\n\n    # 3. Manual Refresh Button\n    st.sidebar.markdown(\"---\")\n    st.sidebar.markdown(\"### 🔄 資料同步\")\n    if st.sidebar.button(\"🔄 更新氣象資料\"):\n        with st.spinner(\"正在向中央氣象署請求最新天氣資料...\"):\n            success, msg = fetch_and_save_weather()\n            if success:\n                st.sidebar.success(msg)\n                st.rerun()\n            else:\n                st.sidebar.error(msg)\n\n    # 4. Last Updated Timestamp\n    last_update = database.get_latest_updated_time()\n    if last_update:\n        st.sidebar.caption(f\"🕒 資料最後更新時間：\\n**{last_update}**\")\n    else:\n        st.sidebar.caption(\"🕒 資料狀態：尚未建立資料\")\n\n    st.sidebar.markdown(\"---\")\n    st.sidebar.info(\n        \"💡 **資料來源說明**：\\n\"\n        \"- 中央氣象署 (CWA) Open Data API\\n\"\n        \"- 資料集：`O-A0003-001` (全台測站實測) & `F-C0032-001` (36h各縣市預報)\\n\"\n        \"- SQLite 本地快取加速\"\n    )\n\n    # ------------------ MAIN DASHBOARD ------------------\n    # Header Banner\n    st.markdown(\n        \"\"\"\n        <div class=\"main-header\">\n            <h1>🌤️ Taiwan Weather Forecast</h1>\n            <p>中央氣象署資料 × Python × SQLite × Streamlit 互動式天氣資料分析系統</p>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n    # Query filtered data for selected region & date\n    region_df = load_weather_data(selected_region)\n\n    if region_df.empty:\n        st.warning(\"⚠️ 目前資料庫中沒有可顯示的天氣資料，請先點選側邊欄「🔄 更新氣象資料」按鈕。\")\n        return\n\n    # Filter by selected date if matches exist, else show all forecast rows for region\n    date_filtered_df = region_df[region_df[\"dataDate\"] == selected_date]\n    display_df = date_filtered_df if not date_filtered_df.empty else region_df\n\n    # Extract current latest metric indicators\n    latest_row = display_df.iloc[0]\n    cur_maxt = latest_row.get(\"MaxT\", 28.0)\n    cur_mint = latest_row.get(\"MinT\", 22.0)\n    cur_pop = latest_row.get(\"PoP\", 0.0)\n    cur_wx = latest_row.get(\"Wx\", \"晴時多雲\")\n\n    # Region Display Title\n    st.markdown(\n        f\"\"\"\n        <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;\">\n            <h2 style=\"margin: 0; color: #1E3A8A; font-size: 1.6rem;\">\n                📍 目前選擇地區：<span style=\"color: #2563EB;\">{selected_region}</span>\n                <span style=\"font-size: 1rem; color: #64748B; font-weight: normal; margin-left: 8px;\">({selected_date})</span>\n            </h2>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n    # 4 Metric Cards\n    col1, col2, col3, col4 = st.columns(4)\n\n    with col1:\n        st.markdown(\n            f\"\"\"\n            <div class=\"metric-card\">\n                <div class=\"metric-icon\">🌡️</div>\n                <div class=\"metric-label\">最高溫 (MaxT)</div>\n                <div class=\"metric-value\" style=\"color: #DC2626;\">{cur_maxt:.0f} °C</div>\n                <div style=\"font-size: 0.8rem; color: #94A3B8;\">今日高溫預測</div>\n            </div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n\n    with col2:\n        st.markdown(\n            f\"\"\"\n            <div class=\"metric-card\">\n                <div class=\"metric-icon\">❄️</div>\n                <div class=\"metric-label\">最低溫 (MinT)</div>\n                <div class=\"metric-value\" style=\"color: #2563EB;\">{cur_mint:.0f} °C</div>\n                <div style=\"font-size: 0.8rem; color: #94A3B8;\">今日低溫預測</div>\n            </div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n\n    with col3:\n        st.markdown(\n            f\"\"\"\n            <div class=\"metric-card\">\n                <div class=\"metric-icon\">☔</div>\n                <div class=\"metric-label\">降雨機率 (PoP)</div>\n                <div class=\"metric-value\" style=\"color: #0284C7;\">{cur_pop:.0f} %</div>\n                <div style=\"font-size: 0.8rem; color: #94A3B8;\">降水機率評估</div>\n            </div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n\n    with col4:\n        st.markdown(\n            f\"\"\"\n            <div class=\"metric-card\">\n                <div class=\"metric-icon\">☁️</div>\n                <div class=\"metric-label\">天氣現象 (Wx)</div>\n                <div class=\"metric-value\" style=\"color: #475569; font-size: 1.45rem;\">{cur_wx}</div>\n                <div style=\"font-size: 0.8rem; color: #94A3B8;\">天候狀況綜覽</div>\n            </div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n\n    st.markdown(\"<br/>\", unsafe_allow_html=True)\n\n    # ------------------ CHART & TABLE TABS ------------------\n    tab1, tab2, tab3 = st.tabs([\"📈 未來溫度預報圖\", \"📊 天氣資料表\", \"🗺️ 臺灣天氣地圖\"])\n\n    with tab1:\n        st.markdown('<div class=\"section-title\">📈 未來溫度預報</div>', unsafe_allow_html=True)\n        fig = render_temperature_chart(region_df, selected_region)\n        st.plotly_chart(fig, use_container_width=True)\n\n    with tab2:\n        st.markdown('<div class=\"section-title\">📊 預報天氣資料表</div>', unsafe_allow_html=True)\n        # Format clean presentation DataFrame\n        table_df = region_df.copy()\n        table_df[\"日期\"] = table_df[\"dataDate\"]\n        table_df[\"預報區間\"] = table_df[\"startTime\"].str[5:16] + \" ~ \" + table_df[\"endTime\"].str[5:16]\n        table_df[\"天氣\"] = table_df[\"Wx\"]\n        table_df[\"最低溫 (°C)\"] = table_df[\"MinT\"].apply(lambda x: f\"{x:.0f}°C\")\n        table_df[\"最高溫 (°C)\"] = table_df[\"MaxT\"].apply(lambda x: f\"{x:.0f}°C\")\n        table_df[\"降雨機率\"] = table_df[\"PoP\"].apply(lambda x: f\"{x:.0f}%\")\n\n        display_cols = [\"日期\", \"預報區間\", \"天氣\", \"最低溫 (°C)\", \"最高溫 (°C)\", \"降雨機率\"]\n        st.dataframe(\n            table_df[display_cols],\n            use_container_width=True,\n            hide_index=True,\n        )\n\n    with tab3:\n        st.markdown('<div class=\"section-title\">🗺️ Taiwan Weather Map (全臺天氣地圖)</div>', unsafe_allow_html=True)\n        st.caption(\"點擊地圖上的各縣市或觀測站標記，可查看詳細氣溫、天氣狀況與降雨評估。\")\n\n        obs_df = load_observations()\n        all_forecast_df = load_weather_data()\n\n        taiwan_map = map_utils.create_taiwan_weather_map(\n            forecast_df=all_forecast_df,\n            observation_df=obs_df,\n            selected_region=selected_region,\n            show_stations=True,\n        )\n\n        st_folium(\n            taiwan_map,\n            width=\"100%\",\n            height=580,\n            returned_objects=[],\n        )\n\n\n# Top-level exports for platforms like Vercel that scan for WSGI/ASGI entrypoints\ndef app(environ=None, start_response=None):\n    if start_response:\n        start_response(\"200 OK\", [(\"Content-Type\", \"text/plain; charset=utf-8\")])\n    return [b\"OK\"]\n\n\napplication = app\nhandler = app\n\n\nif __name__ == \"__main__\":\n    main()\n\n", "config.py": "\"\"\"Central configuration module for Taiwan Weather Forecast application.\n\nHandles environment variables, API endpoints, dataset IDs, database path,\nand geographic reference constants for Taiwan counties and cities.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\nfrom pathlib import Path\nfrom typing import Dict, List, Optional, Tuple\n\n# Base Directories\nBASE_DIR = Path(__file__).resolve().parent\nDATA_DIR = BASE_DIR / \"data\"\nSTREAMLIT_SECRETS_PATH = BASE_DIR / \".streamlit\" / \"secrets.toml\"\nENV_PATH = BASE_DIR / \".env\"\n\n# Database Configuration\nDB_PATH = BASE_DIR / \"data.db\"\n\n# CWA API Endpoints & Datasets\nCWA_BASE_URL = \"https://opendata.cwa.gov.tw/api/v1/rest/datastore\"\n# O-A0003-001: 中央氣象署自動氣象站(氣象觀測資料) - 全台363個觀測站即時觀測資料\nDATASET_OBSERVATION = \"O-A0003-001\"\n# F-C0032-001: 一般天氣預報-今明36小時天氣預報 (包含 22 縣市 Wx, PoP, MinT, MaxT)\nDATASET_FORECAST = \"F-C0032-001\"\nDEFAULT_DATASET = DATASET_OBSERVATION\n\n# HTTP Client Settings\nREQUEST_TIMEOUT = 15  # seconds\n\n# 臺灣 22 縣市標準清單 (照地理分區排列)\nTAIWAN_COUNTIES: List[str] = [\n    \"臺北市\",\n    \"新北市\",\n    \"桃園市\",\n    \"臺中市\",\n    \"臺南市\",\n    \"高雄市\",\n    \"基隆市\",\n    \"新竹市\",\n    \"新竹縣\",\n    \"苗栗縣\",\n    \"彰化縣\",\n    \"南投縣\",\n    \"雲林縣\",\n    \"嘉義市\",\n    \"嘉義縣\",\n    \"屏東縣\",\n    \"宜蘭縣\",\n    \"花蓮縣\",\n    \"臺東縣\",\n    \"澎湖縣\",\n    \"金門縣\",\n    \"連江縣\",\n]\n\n# 22 縣市代表性地理經緯度座標 (WGS84 [緯度 Latitude, 經度 Longitude])\nCOUNTY_COORDINATES: Dict[str, Tuple[float, float]] = {\n    \"臺北市\": (25.0375, 121.5637),\n    \"新北市\": (25.0118, 121.4658),\n    \"桃園市\": (24.9936, 121.3010),\n    \"臺中市\": (24.1627, 120.6473),\n    \"臺南市\": (22.9997, 120.2270),\n    \"高雄市\": (22.6273, 120.3014),\n    \"基隆市\": (25.1276, 121.7392),\n    \"新竹市\": (24.8138, 120.9675),\n    \"新竹縣\": (24.8387, 121.0177),\n    \"苗栗縣\": (24.5602, 120.8214),\n    \"彰化縣\": (24.0817, 120.5385),\n    \"南投縣\": (23.9037, 120.6859),\n    \"雲林縣\": (23.7092, 120.4313),\n    \"嘉義市\": (23.4800, 120.4491),\n    \"嘉義縣\": (23.4518, 120.2559),\n    \"屏東縣\": (22.6761, 120.4941),\n    \"宜蘭縣\": (24.7021, 121.7377),\n    \"花蓮縣\": (23.9922, 121.6016),\n    \"臺東縣\": (22.7583, 121.1444),\n    \"澎湖縣\": (23.5712, 119.5793),\n    \"金門縣\": (24.4493, 118.3766),\n    \"連江縣\": (26.1505, 119.9499),\n}\n\n\ndef get_api_key() -> Optional[str]:\n    \"\"\"Retrieve the CWA API Key from session_state, environment, .streamlit/secrets.toml, or .env.\n\n    Resolution precedence:\n    0. st.session_state[\"user_cwa_api_key\"] (for WebAssembly / stlite user input)\n    1. os.environ[\"CWA_API_KEY\"]\n    2. .streamlit/secrets.toml\n    3. .env file\n\n    Returns:\n        Optional[str]: The API key string if found, otherwise None.\n    \"\"\"\n    # 0. Check Streamlit session_state & secrets (crucial for stlite WebAssembly)\n    try:\n        import streamlit as st\n        from streamlit.runtime.scriptrunner import get_script_run_ctx\n\n        if get_script_run_ctx(suppress_warning=True) is not None:\n            if \"user_cwa_api_key\" in st.session_state and st.session_state[\"user_cwa_api_key\"]:\n                key_candidate = str(st.session_state[\"user_cwa_api_key\"]).strip()\n                if key_candidate:\n                    return key_candidate\n            if hasattr(st, \"secrets\") and \"CWA_API_KEY\" in st.secrets:\n                key_candidate = str(st.secrets[\"CWA_API_KEY\"]).strip()\n                if key_candidate:\n                    return key_candidate\n    except Exception:\n        pass\n\n    # 1. Check os.environ\n    env_key = os.environ.get(\"CWA_API_KEY\")\n    if env_key and env_key.strip():\n        return env_key.strip()\n\n    # 2. Try loading from .streamlit/secrets.toml\n    if STREAMLIT_SECRETS_PATH.exists():\n        try:\n            import tomllib\n\n            content = STREAMLIT_SECRETS_PATH.read_text(encoding=\"utf-8\")\n            secrets_data = tomllib.loads(content)\n            key = secrets_data.get(\"CWA_API_KEY\")\n            if key and str(key).strip():\n                return str(key).strip()\n        except Exception:\n            pass\n\n    # 3. Try parsing .env manually or with dotenv\n    if ENV_PATH.exists():\n        try:\n            for line in ENV_PATH.read_text(encoding=\"utf-8\").splitlines():\n                line = line.strip()\n                if line and not line.startswith(\"#\") and \"=\" in line:\n                    k, v = line.split(\"=\", 1)\n                    if k.strip() == \"CWA_API_KEY\":\n                        val = v.strip().strip(\"'\\\"\")\n                        if val:\n                            return val\n        except Exception:\n            pass\n\n    return None\n", "data_processor.py": "\"\"\"Module for parsing, cleaning, and transforming raw CWA JSON data into Pandas DataFrames.\n\nHandles data cleansing, type conversions, missing values, and formatting\nfor both weather forecasts (F-C0032-001) and station observations (O-A0003-001).\n\"\"\"\n\nfrom __future__ import annotations\n\nimport logging\nfrom typing import Any, Dict, List, Optional\n\nimport pandas as pd\n\nlogger = logging.getLogger(__name__)\n\n\ndef safe_float(val: Any, default: Optional[float] = None) -> Optional[float]:\n    \"\"\"Safely convert a value to float, returning default if invalid or -99 (CWA sensor error).\"\"\"\n    if val is None or val == \"\" or val == \"-99\" or val == -99 or val == \"-99.0\":\n        return default\n    try:\n        return float(val)\n    except (ValueError, TypeError):\n        return default\n\n\ndef parse_forecast_json(raw_json: Dict[str, Any]) -> pd.DataFrame:\n    \"\"\"Parse CWA Forecast JSON (F-C0032-001) into a structured Pandas DataFrame.\n\n    Output Schema:\n        regionName | dataDate | startTime | endTime | Wx | PoP | MinT | MaxT\n\n    Args:\n        raw_json: Parsed response from CWA F-C0032-001 API.\n\n    Returns:\n        pd.DataFrame: Cleaned DataFrame conforming to the project specification.\n    \"\"\"\n    records = raw_json.get(\"records\", {})\n    locations = records.get(\"location\", [])\n\n    rows: List[Dict[str, Any]] = []\n\n    for loc in locations:\n        region_name = loc.get(\"locationName\", \"\").strip()\n        weather_elements = loc.get(\"weatherElement\", [])\n\n        # Map elementName -> list of {startTime, endTime, parameter}\n        element_map: Dict[str, Dict[str, Dict[str, Any]]] = {}\n        for elem in weather_elements:\n            elem_name = elem.get(\"elementName\")\n            times = elem.get(\"time\", [])\n            for t in times:\n                st = t.get(\"startTime\", \"\")\n                et = t.get(\"endTime\", \"\")\n                param = t.get(\"parameter\", {})\n                time_key = f\"{st}|{et}\"\n                if time_key not in element_map:\n                    element_map[time_key] = {\n                        \"startTime\": st,\n                        \"endTime\": et,\n                    }\n                element_map[time_key][elem_name] = param\n\n        for time_key, data in element_map.items():\n            start_time = data.get(\"startTime\", \"\")\n            end_time = data.get(\"endTime\", \"\")\n            # Derive dataDate (YYYY-MM-DD) from startTime\n            data_date = start_time.split(\" \")[0] if \" \" in start_time else start_time[:10]\n\n            wx_param = data.get(\"Wx\", {})\n            wx = wx_param.get(\"parameterName\", \"多雲\") if isinstance(wx_param, dict) else str(wx_param)\n\n            pop_param = data.get(\"PoP\", {})\n            pop_val = pop_param.get(\"parameterName\") if isinstance(pop_param, dict) else pop_param\n            pop = safe_float(pop_val, default=0.0)\n\n            mint_param = data.get(\"MinT\", {})\n            mint_val = mint_param.get(\"parameterName\") if isinstance(mint_param, dict) else mint_param\n            mint = safe_float(mint_val, default=20.0)\n\n            maxt_param = data.get(\"MaxT\", {})\n            maxt_val = maxt_param.get(\"parameterName\") if isinstance(maxt_param, dict) else maxt_param\n            maxt = safe_float(maxt_val, default=28.0)\n\n            rows.append({\n                \"regionName\": region_name,\n                \"dataDate\": data_date,\n                \"startTime\": start_time,\n                \"endTime\": end_time,\n                \"Wx\": wx,\n                \"PoP\": pop,\n                \"MinT\": mint,\n                \"MaxT\": maxt,\n            })\n\n    if not rows:\n        return pd.DataFrame(columns=[\n            \"regionName\", \"dataDate\", \"startTime\", \"endTime\", \"Wx\", \"PoP\", \"MinT\", \"MaxT\"\n        ])\n\n    df = pd.DataFrame(rows)\n    # Deduplicate & sort\n    df = df.drop_duplicates(subset=[\"regionName\", \"startTime\", \"endTime\"])\n    df = df.sort_values(by=[\"regionName\", \"startTime\"]).reset_index(drop=True)\n    return df\n\n\ndef parse_observation_json(raw_json: Dict[str, Any]) -> pd.DataFrame:\n    \"\"\"Parse CWA Observation JSON (O-A0003-001) into a structured Pandas DataFrame.\n\n    Converts station observations into table rows with county-level metrics\n    as well as station-level metadata (coordinates, current temperature, etc.).\n\n    Args:\n        raw_json: Parsed response from CWA O-A0003-001 API.\n\n    Returns:\n        pd.DataFrame: Observation records with station details and county forecasts.\n    \"\"\"\n    records = raw_json.get(\"records\", {})\n    stations = records.get(\"Station\", [])\n\n    rows: List[Dict[str, Any]] = []\n\n    for st in stations:\n        geo = st.get(\"GeoInfo\", {})\n        county = geo.get(\"CountyName\", \"\").strip()\n        town = geo.get(\"TownName\", \"\").strip()\n        st_name = st.get(\"StationName\", \"\").strip()\n        st_id = st.get(\"StationId\", \"\").strip()\n\n        # Coordinates (WGS84 preferred)\n        coords = geo.get(\"Coordinates\", [])\n        lat, lon = None, None\n        for coord in coords:\n            if coord.get(\"CoordinateName\") == \"WGS84\":\n                lat = safe_float(coord.get(\"StationLatitude\"))\n                lon = safe_float(coord.get(\"StationLongitude\"))\n                break\n        if lat is None and coords:\n            lat = safe_float(coords[0].get(\"StationLatitude\"))\n            lon = safe_float(coords[0].get(\"StationLongitude\"))\n\n        obs_time = st.get(\"ObsTime\", {}).get(\"DateTime\", \"\")\n        # Format: 2026-09-23T19:20:00+08:00\n        data_date = obs_time[:10] if len(obs_time) >= 10 else \"\"\n        formatted_time = obs_time.replace(\"T\", \" \")[:19] if \"T\" in obs_time else obs_time\n\n        we = st.get(\"WeatherElement\", {})\n        wx = we.get(\"Weather\", \"\") or \"多雲\"\n        temp = safe_float(we.get(\"AirTemperature\"))\n        humidity = safe_float(we.get(\"RelativeHumidity\"), default=0.0)\n\n        # Rain / Precip\n        now_info = we.get(\"Now\", {})\n        precip = safe_float(now_info.get(\"Precipitation\")) if isinstance(now_info, dict) else 0.0\n\n        # Daily extremes (MaxT, MinT)\n        daily = we.get(\"DailyExtreme\", {})\n        maxt_info = daily.get(\"DailyHigh\", {}).get(\"TemperatureInfo\", {}) if isinstance(daily, dict) else {}\n        mint_info = daily.get(\"DailyLow\", {}).get(\"TemperatureInfo\", {}) if isinstance(daily, dict) else {}\n\n        maxt = safe_float(maxt_info.get(\"AirTemperature\")) if isinstance(maxt_info, dict) else None\n        mint = safe_float(mint_info.get(\"AirTemperature\")) if isinstance(mint_info, dict) else None\n\n        # Fallbacks if extremes not yet populated\n        if maxt is None and temp is not None:\n            maxt = temp\n        if mint is None and temp is not None:\n            mint = temp\n\n        rows.append({\n            \"regionName\": county if county else st_name,\n            \"dataDate\": data_date,\n            \"startTime\": formatted_time,\n            \"endTime\": formatted_time,\n            \"Wx\": wx,\n            \"PoP\": humidity,  # Observation proxy for moisture / PoP\n            \"MinT\": mint if mint is not None else 20.0,\n            \"MaxT\": maxt if maxt is not None else 28.0,\n            \"temp\": temp,\n            \"stationName\": st_name,\n            \"stationId\": st_id,\n            \"townName\": town,\n            \"latitude\": lat,\n            \"longitude\": lon,\n            \"precipitation\": precip,\n        })\n\n    if not rows:\n        return pd.DataFrame(columns=[\n            \"regionName\", \"dataDate\", \"startTime\", \"endTime\", \"Wx\", \"PoP\", \"MinT\", \"MaxT\",\n            \"temp\", \"stationName\", \"stationId\", \"townName\", \"latitude\", \"longitude\", \"precipitation\"\n        ])\n\n    df = pd.DataFrame(rows)\n    return df\n", "database.py": "\"\"\"SQLite database access module for Taiwan Weather Forecast application.\n\nManages connection pooling, schema initialization, and SQL operations\nfor temperature forecasts and weather station observations.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport logging\nfrom pathlib import Path\nfrom typing import Any, Dict, List, Optional, Union\n\nimport pandas as pd\n\nimport config\n\nlogger = logging.getLogger(__name__)\n\n\ndef get_db_connection(db_path: Optional[Union[str, Path]] = None) -> sqlite3.Connection:\n    \"\"\"Create and return a new SQLite database connection.\n\n    Args:\n        db_path: Path to SQLite database file. Defaults to config.DB_PATH.\n\n    Returns:\n        sqlite3.Connection: Database connection configured with Row factory.\n    \"\"\"\n    path = Path(db_path or config.DB_PATH)\n    path.parent.mkdir(parents=True, exist_ok=True)\n    conn = sqlite3.connect(str(path))\n    conn.row_factory = sqlite3.Row\n    return conn\n\n\ndef init_database(db_path: Optional[Union[str, Path]] = None) -> None:\n    \"\"\"Initialize database tables with appropriate constraints and indices.\n\n    Creates:\n    - TemperatureForecasts: Stores forecast intervals (regionName, dataDate, startTime, etc.)\n    - StationObservations: Stores real-time station observations and coordinates.\n    \"\"\"\n    conn = get_db_connection(db_path)\n    try:\n        with conn:\n            # 1. TemperatureForecasts table\n            conn.execute(\n                \"\"\"\n                CREATE TABLE IF NOT EXISTS TemperatureForecasts (\n                    id INTEGER PRIMARY KEY AUTOINCREMENT,\n                    regionName TEXT NOT NULL,\n                    dataDate TEXT NOT NULL,\n                    startTime TEXT NOT NULL,\n                    endTime TEXT NOT NULL,\n                    Wx TEXT,\n                    PoP REAL,\n                    MinT REAL,\n                    MaxT REAL,\n                    temp REAL,\n                    updatedAt TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n                    CONSTRAINT uq_region_time UNIQUE (regionName, startTime, endTime)\n                )\n                \"\"\"\n            )\n\n            # Indices for fast queries\n            conn.execute(\n                \"CREATE INDEX IF NOT EXISTS idx_forecast_region ON TemperatureForecasts(regionName)\"\n            )\n            conn.execute(\n                \"CREATE INDEX IF NOT EXISTS idx_forecast_date ON TemperatureForecasts(dataDate)\"\n            )\n\n            # 2. StationObservations table (for O-A0003-001 observation map & details)\n            conn.execute(\n                \"\"\"\n                CREATE TABLE IF NOT EXISTS StationObservations (\n                    id INTEGER PRIMARY KEY AUTOINCREMENT,\n                    stationId TEXT UNIQUE NOT NULL,\n                    stationName TEXT NOT NULL,\n                    regionName TEXT NOT NULL,\n                    townName TEXT,\n                    dataDate TEXT,\n                    startTime TEXT,\n                    endTime TEXT,\n                    Wx TEXT,\n                    temp REAL,\n                    MinT REAL,\n                    MaxT REAL,\n                    PoP REAL,\n                    precipitation REAL,\n                    latitude REAL,\n                    longitude REAL,\n                    updatedAt TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n                )\n                \"\"\"\n            )\n            conn.execute(\n                \"CREATE INDEX IF NOT EXISTS idx_station_region ON StationObservations(regionName)\"\n            )\n    finally:\n        conn.close()\n\n\ndef insert_weather_data(\n    df: pd.DataFrame,\n    db_path: Optional[Union[str, Path]] = None,\n    table_name: str = \"TemperatureForecasts\",\n) -> int:\n    \"\"\"Insert or update weather records into SQLite from a DataFrame.\n\n    Uses INSERT OR REPLACE to prevent duplicate entries while updating existing keys.\n\n    Args:\n        df: Cleaned Pandas DataFrame.\n        db_path: Path to SQLite DB.\n        table_name: Target table ('TemperatureForecasts' or 'StationObservations').\n\n    Returns:\n        int: Number of rows successfully inserted or updated.\n    \"\"\"\n    if df.empty:\n        return 0\n\n    conn = get_db_connection(db_path)\n    inserted_count = 0\n    try:\n        with conn:\n            if table_name == \"TemperatureForecasts\":\n                sql = \"\"\"\n                    INSERT INTO TemperatureForecasts\n                    (regionName, dataDate, startTime, endTime, Wx, PoP, MinT, MaxT, temp)\n                    VALUES (:regionName, :dataDate, :startTime, :endTime, :Wx, :PoP, :MinT, :MaxT, :temp)\n                    ON CONFLICT(regionName, startTime, endTime) DO UPDATE SET\n                        dataDate=excluded.dataDate,\n                        Wx=excluded.Wx,\n                        PoP=excluded.PoP,\n                        MinT=excluded.MinT,\n                        MaxT=excluded.MaxT,\n                        temp=excluded.temp,\n                        updatedAt=CURRENT_TIMESTAMP\n                \"\"\"\n                records = []\n                for _, row in df.iterrows():\n                    records.append({\n                        \"regionName\": str(row.get(\"regionName\", \"\")),\n                        \"dataDate\": str(row.get(\"dataDate\", \"\")),\n                        \"startTime\": str(row.get(\"startTime\", \"\")),\n                        \"endTime\": str(row.get(\"endTime\", \"\")),\n                        \"Wx\": str(row.get(\"Wx\", \"多雲\")),\n                        \"PoP\": float(row.get(\"PoP\", 0.0)) if pd.notna(row.get(\"PoP\")) else 0.0,\n                        \"MinT\": float(row.get(\"MinT\", 20.0)) if pd.notna(row.get(\"MinT\")) else 20.0,\n                        \"MaxT\": float(row.get(\"MaxT\", 28.0)) if pd.notna(row.get(\"MaxT\")) else 28.0,\n                        \"temp\": float(row.get(\"temp\", 0.0)) if pd.notna(row.get(\"temp\")) else None,\n                    })\n                conn.executemany(sql, records)\n                inserted_count = len(records)\n\n            elif table_name == \"StationObservations\":\n                sql = \"\"\"\n                    INSERT INTO StationObservations\n                    (stationId, stationName, regionName, townName, dataDate, startTime, endTime,\n                     Wx, temp, MinT, MaxT, PoP, precipitation, latitude, longitude)\n                    VALUES\n                    (:stationId, :stationName, :regionName, :townName, :dataDate, :startTime, :endTime,\n                     :Wx, :temp, :MinT, :MaxT, :PoP, :precipitation, :latitude, :longitude)\n                    ON CONFLICT(stationId) DO UPDATE SET\n                        stationName=excluded.stationName,\n                        regionName=excluded.regionName,\n                        townName=excluded.townName,\n                        dataDate=excluded.dataDate,\n                        startTime=excluded.startTime,\n                        endTime=excluded.endTime,\n                        Wx=excluded.Wx,\n                        temp=excluded.temp,\n                        MinT=excluded.MinT,\n                        MaxT=excluded.MaxT,\n                        PoP=excluded.PoP,\n                        precipitation=excluded.precipitation,\n                        latitude=excluded.latitude,\n                        longitude=excluded.longitude,\n                        updatedAt=CURRENT_TIMESTAMP\n                \"\"\"\n                records = []\n                for _, row in df.iterrows():\n                    st_id = str(row.get(\"stationId\", \"\"))\n                    if not st_id:\n                        continue\n                    records.append({\n                        \"stationId\": st_id,\n                        \"stationName\": str(row.get(\"stationName\", \"\")),\n                        \"regionName\": str(row.get(\"regionName\", \"\")),\n                        \"townName\": str(row.get(\"townName\", \"\")),\n                        \"dataDate\": str(row.get(\"dataDate\", \"\")),\n                        \"startTime\": str(row.get(\"startTime\", \"\")),\n                        \"endTime\": str(row.get(\"endTime\", \"\")),\n                        \"Wx\": str(row.get(\"Wx\", \"多雲\")),\n                        \"temp\": float(row.get(\"temp\")) if pd.notna(row.get(\"temp\")) else None,\n                        \"MinT\": float(row.get(\"MinT\")) if pd.notna(row.get(\"MinT\")) else None,\n                        \"MaxT\": float(row.get(\"MaxT\")) if pd.notna(row.get(\"MaxT\")) else None,\n                        \"PoP\": float(row.get(\"PoP\")) if pd.notna(row.get(\"PoP\")) else None,\n                        \"precipitation\": float(row.get(\"precipitation\")) if pd.notna(row.get(\"precipitation\")) else 0.0,\n                        \"latitude\": float(row.get(\"latitude\")) if pd.notna(row.get(\"latitude\")) else None,\n                        \"longitude\": float(row.get(\"longitude\")) if pd.notna(row.get(\"longitude\")) else None,\n                    })\n                conn.executemany(sql, records)\n                inserted_count = len(records)\n    finally:\n        conn.close()\n\n    return inserted_count\n\n\ndef query_weather_by_region(\n    region_name: str,\n    db_path: Optional[Union[str, Path]] = None,\n) -> pd.DataFrame:\n    \"\"\"Query weather forecasts for a specific region/county.\n\n    SQL:\n        SELECT * FROM TemperatureForecasts WHERE regionName = ? ORDER BY startTime;\n    \"\"\"\n    conn = get_db_connection(db_path)\n    try:\n        query = \"\"\"\n            SELECT id, regionName, dataDate, startTime, endTime, Wx, PoP, MinT, MaxT, temp, updatedAt\n            FROM TemperatureForecasts\n            WHERE regionName = ?\n            ORDER BY startTime ASC\n        \"\"\"\n        df = pd.read_sql_query(query, conn, params=(region_name,))\n        return df\n    finally:\n        conn.close()\n\n\ndef query_weather_by_date(\n    date_str: str,\n    db_path: Optional[Union[str, Path]] = None,\n) -> pd.DataFrame:\n    \"\"\"Query weather forecasts for a specific date (YYYY-MM-DD).\n\n    SQL:\n        SELECT * FROM TemperatureForecasts WHERE dataDate = ? ORDER BY regionName, startTime;\n    \"\"\"\n    conn = get_db_connection(db_path)\n    try:\n        query = \"\"\"\n            SELECT id, regionName, dataDate, startTime, endTime, Wx, PoP, MinT, MaxT, temp, updatedAt\n            FROM TemperatureForecasts\n            WHERE dataDate = ?\n            ORDER BY regionName, startTime ASC\n        \"\"\"\n        df = pd.read_sql_query(query, conn, params=(date_str,))\n        return df\n    finally:\n        conn.close()\n\n\ndef query_all_weather(\n    db_path: Optional[Union[str, Path]] = None,\n) -> pd.DataFrame:\n    \"\"\"Query all weather forecast records from SQLite.\"\"\"\n    conn = get_db_connection(db_path)\n    try:\n        query = \"\"\"\n            SELECT id, regionName, dataDate, startTime, endTime, Wx, PoP, MinT, MaxT, temp, updatedAt\n            FROM TemperatureForecasts\n            ORDER BY regionName, startTime ASC\n        \"\"\"\n        return pd.read_sql_query(query, conn)\n    finally:\n        conn.close()\n\n\ndef query_all_observations(\n    region_name: Optional[str] = None,\n    db_path: Optional[Union[str, Path]] = None,\n) -> pd.DataFrame:\n    \"\"\"Query real-time station observations with geographic coordinates.\n\n    Used by Folium map and local detailed station cards.\n    \"\"\"\n    conn = get_db_connection(db_path)\n    try:\n        if region_name:\n            query = \"\"\"\n                SELECT * FROM StationObservations\n                WHERE regionName = ?\n                ORDER BY temp DESC\n            \"\"\"\n            return pd.read_sql_query(query, conn, params=(region_name,))\n        else:\n            query = \"SELECT * FROM StationObservations ORDER BY regionName, stationName\"\n            return pd.read_sql_query(query, conn)\n    finally:\n        conn.close()\n\n\ndef get_latest_updated_time(db_path: Optional[Union[str, Path]] = None) -> Optional[str]:\n    \"\"\"Retrieve the most recent update timestamp from the database.\"\"\"\n    conn = get_db_connection(db_path)\n    try:\n        cur = conn.cursor()\n        cur.execute(\"SELECT MAX(updatedAt) FROM TemperatureForecasts\")\n        row = cur.fetchone()\n        if row and row[0]:\n            return str(row[0])\n        cur.execute(\"SELECT MAX(updatedAt) FROM StationObservations\")\n        row = cur.fetchone()\n        return str(row[0]) if row and row[0] else None\n    finally:\n        conn.close()\n\n\ndef clear_old_data(db_path: Optional[Union[str, Path]] = None) -> None:\n    \"\"\"Clear all records from database tables.\"\"\"\n    conn = get_db_connection(db_path)\n    try:\n        with conn:\n            conn.execute(\"DELETE FROM TemperatureForecasts\")\n            conn.execute(\"DELETE FROM StationObservations\")\n    finally:\n        conn.close()\n", "map_utils.py": "\"\"\"Taiwan Weather Map generator using Folium.\n\nGenerates responsive, interactive maps with customized markers for Taiwan\ncounties and real-time automated weather stations.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport logging\nfrom typing import Optional\n\nimport folium\nfrom folium.plugins import MarkerCluster\nimport pandas as pd\n\nimport config\n\nlogger = logging.getLogger(__name__)\n\n\ndef get_marker_color(temp: Optional[float]) -> str:\n    \"\"\"Return a marker color based on Celsius temperature.\"\"\"\n    if temp is None:\n        return \"gray\"\n    if temp >= 32:\n        return \"red\"\n    if temp >= 28:\n        return \"orange\"\n    if temp >= 22:\n        return \"green\"\n    if temp >= 16:\n        return \"blue\"\n    return \"darkblue\"\n\n\ndef get_weather_icon(wx: str) -> str:\n    \"\"\"Return a FontAwesome icon name for weather conditions.\"\"\"\n    if not wx:\n        return \"cloud\"\n    if \"晴\" in wx:\n        return \"sun\"\n    if \"雨\" in wx:\n        return \"cloud-rain\"\n    if \"陰\" in wx:\n        return \"cloud\"\n    if \"雷\" in wx:\n        return \"bolt\"\n    if \"霧\" in wx:\n        return \"smog\"\n    return \"cloud-sun\"\n\n\ndef create_taiwan_weather_map(\n    forecast_df: Optional[pd.DataFrame] = None,\n    observation_df: Optional[pd.DataFrame] = None,\n    selected_region: Optional[str] = None,\n    show_stations: bool = True,\n) -> folium.Map:\n    \"\"\"Generate an interactive Taiwan Weather Map using Folium.\n\n    Args:\n        forecast_df: DataFrame of county forecasts (regionName, temp/MaxT/MinT, Wx, PoP).\n        observation_df: DataFrame of station observations with lat/lon.\n        selected_region: Optional regionName to highlight and center on.\n        show_stations: If True, include cluster of detailed observation stations.\n\n    Returns:\n        folium.Map: Ready-to-render Folium Map object.\n    \"\"\"\n    # Default Taiwan Center\n    center_lat, center_lon = 23.7, 120.95\n    zoom_start = 8\n\n    # If selected_region has coordinates, adjust center\n    if selected_region and selected_region in config.COUNTY_COORDINATES:\n        c_lat, c_lon = config.COUNTY_COORDINATES[selected_region]\n        center_lat, center_lon = c_lat, c_lon\n        zoom_start = 10\n\n    taiwan_map = folium.Map(\n        location=[center_lat, center_lon],\n        zoom_start=zoom_start,\n        tiles=\"OpenStreetMap\",\n        control_scale=True,\n    )\n\n    # 1. Add County Overview Markers\n    county_summary: dict[str, dict] = {}\n    if forecast_df is not None and not forecast_df.empty:\n        # Group by regionName and take the latest/first record\n        for region, group in forecast_df.groupby(\"regionName\"):\n            first_row = group.iloc[0]\n            temp_val = first_row.get(\"temp\")\n            if pd.isna(temp_val) or temp_val is None:\n                # Estimate from (MinT + MaxT) / 2\n                mint = first_row.get(\"MinT\", 20.0)\n                maxt = first_row.get(\"MaxT\", 28.0)\n                temp_val = round((float(mint) + float(maxt)) / 2, 1) if pd.notna(mint) and pd.notna(maxt) else 25.0\n\n            county_summary[region] = {\n                \"temp\": float(temp_val),\n                \"Wx\": str(first_row.get(\"Wx\", \"多雲\")),\n                \"MinT\": float(first_row.get(\"MinT\", 20.0)) if pd.notna(first_row.get(\"MinT\")) else 20.0,\n                \"MaxT\": float(first_row.get(\"MaxT\", 28.0)) if pd.notna(first_row.get(\"MaxT\")) else 28.0,\n                \"PoP\": float(first_row.get(\"PoP\", 0.0)) if pd.notna(first_row.get(\"PoP\")) else 0.0,\n            }\n\n    for county, (lat, lon) in config.COUNTY_COORDINATES.items():\n        info = county_summary.get(county, {\n            \"temp\": 25.0,\n            \"Wx\": \"多雲\",\n            \"MinT\": 22.0,\n            \"MaxT\": 28.0,\n            \"PoP\": 20.0,\n        })\n        temp = info[\"temp\"]\n        wx = info[\"Wx\"]\n        color = get_marker_color(temp)\n\n        is_selected = (county == selected_region)\n        border_style = \"border: 3px solid #1E88E5; transform: scale(1.15);\" if is_selected else \"\"\n\n        html_popup = f\"\"\"\n        <div style=\"font-family: 'Helvetica Neue', Arial, sans-serif; min-width: 170px; padding: 6px; {border_style}\">\n            <h4 style=\"margin: 0 0 6px 0; color: #1565C0; font-size: 16px;\">{county}</h4>\n            <div style=\"font-size: 22px; font-weight: bold; color: #D32F2F; margin-bottom: 4px;\">\n                {temp:.1f} °C\n            </div>\n            <div style=\"font-size: 13px; color: #424242; line-height: 1.5;\">\n                <b>天氣狀況：</b> {wx}<br/>\n                <b>氣溫區間：</b> {info['MinT']:.0f}°C ~ {info['MaxT']:.0f}°C<br/>\n                <b>降雨機率：</b> {info['PoP']:.0f}%\n            </div>\n        </div>\n        \"\"\"\n\n        folium.Marker(\n            location=[lat, lon],\n            popup=folium.Popup(html_popup, max_width=260),\n            tooltip=f\"{county}: {temp:.1f}°C ({wx})\",\n            icon=folium.Icon(\n                color=color,\n                icon=get_weather_icon(wx),\n                prefix=\"fa\",\n            ),\n        ).add_to(taiwan_map)\n\n    # 2. Add Detailed Station Markers (if observation data present)\n    if show_stations and observation_df is not None and not observation_df.empty:\n        station_cluster = MarkerCluster(name=\"自動氣象觀測站 (363 站)\").add_to(taiwan_map)\n        valid_stations = observation_df.dropna(subset=[\"latitude\", \"longitude\", \"temp\"])\n\n        for _, row in valid_stations.iterrows():\n            lat = float(row[\"latitude\"])\n            lon = float(row[\"longitude\"])\n            st_name = row.get(\"stationName\", \"測站\")\n            county = row.get(\"regionName\", \"\")\n            town = row.get(\"townName\", \"\")\n            st_temp = float(row[\"temp\"])\n            st_wx = str(row.get(\"Wx\", \"觀測中\"))\n            precip = float(row.get(\"precipitation\", 0.0))\n\n            station_popup = f\"\"\"\n            <div style=\"font-family: sans-serif; font-size: 12px; min-width: 140px;\">\n                <b style=\"color: #0288D1;\">{st_name} 測站</b> ({county} {town})<br/>\n                <b>即時氣溫：</b> {st_temp:.1f} °C<br/>\n                <b>天氣現象：</b> {st_wx}<br/>\n                <b>當前雨量：</b> {precip:.1f} mm\n            </div>\n            \"\"\"\n\n            folium.CircleMarker(\n                location=[lat, lon],\n                radius=4,\n                color=\"#0288D1\",\n                fill=True,\n                fill_color=\"#29B6F6\",\n                fill_opacity=0.7,\n                popup=folium.Popup(station_popup, max_width=200),\n                tooltip=f\"{st_name}: {st_temp:.1f}°C\",\n            ).add_to(station_cluster)\n\n        folium.LayerControl().add_to(taiwan_map)\n\n    return taiwan_map\n", "weather_api.py": "\"\"\"Module for interacting with Central Weather Administration (CWA) Open Data API.\n\nFetches real-time observations and weather forecasts securely using HTTP requests,\nwith comprehensive error handling, timeout controls, and payload validation.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport logging\nfrom typing import Any, Dict, Optional\n\n# Enable requests in Pyodide / WebAssembly environment\ntry:\n    import pyodide_http\n\n    pyodide_http.patch_all()\nexcept ImportError:\n    pass\n\nimport requests\n\nimport config\n\nlogger = logging.getLogger(__name__)\n\n\nclass WeatherAPIError(Exception):\n    \"\"\"Custom exception raised when CWA API requests fail.\"\"\"\n\n    pass\n\n\ndef mask_key(key: Optional[str]) -> str:\n    \"\"\"Return a masked representation of an API key for safe logging.\n\n    Args:\n        key: The raw API key string.\n\n    Returns:\n        str: Masked string, e.g. 'CWA-55F...4FB2'.\n    \"\"\"\n    if not key:\n        return \"<None>\"\n    if len(key) <= 8:\n        return \"***\"\n    return f\"{key[:7]}...{key[-4:]}\"\n\n\ndef get_weather_data(\n    dataset_id: str = config.DEFAULT_DATASET,\n    location_name: Optional[str] = None,\n    api_key: Optional[str] = None,\n    timeout: int = config.REQUEST_TIMEOUT,\n) -> Dict[str, Any]:\n    \"\"\"Fetch raw weather data from CWA Open Data API.\n\n    Args:\n        dataset_id: CWA dataset identifier (e.g., 'O-A0003-001' or 'F-C0032-001').\n        location_name: Optional filter for specific county/station name.\n        api_key: Optional CWA API Key override. If None, loaded via config.get_api_key().\n        timeout: HTTP request timeout in seconds.\n\n    Returns:\n        Dict[str, Any]: Parsed JSON response dictionary.\n\n    Raises:\n        WeatherAPIError: If API key is missing, network fails, status code != 200,\n                         or response payload indicates failure.\n    \"\"\"\n    token = api_key or config.get_api_key()\n    if not token or not token.strip():\n        raise WeatherAPIError(\n            \"尚未設定 CWA API Key，請先設定 secrets.toml 或 .env 檔案。\"\n        )\n\n    url = f\"{config.CWA_BASE_URL}/{dataset_id}\"\n    params: Dict[str, Any] = {\n        \"Authorization\": token.strip(),\n    }\n    if location_name:\n        params[\"locationName\"] = location_name\n\n    logger.info(\n        \"Requesting CWA API: dataset=%s, location=%s, key=%s\",\n        dataset_id,\n        location_name or \"ALL\",\n        mask_key(token),\n    )\n\n    try:\n        response = requests.get(url, params=params, timeout=timeout)\n        response.raise_for_status()\n    except requests.exceptions.Timeout as exc:\n        raise WeatherAPIError(\n            f\"中央氣象署 API 連線逾時（超過 {timeout} 秒），請檢查網路狀態。\"\n        ) from exc\n    except requests.exceptions.HTTPError as exc:\n        status_code = response.status_code if \"response\" in locals() else None\n        if status_code in (401, 403):\n            raise WeatherAPIError(\n                \"中央氣象署 API 授權失敗（HTTP 401/403），請確認 API Key 是否正確且有效。\"\n            ) from exc\n        if status_code == 404:\n            raise WeatherAPIError(\n                f\"請求的氣象資料集不存在 (HTTP 404: {dataset_id})，請確認資料集代碼。\"\n            ) from exc\n        raise WeatherAPIError(\n            f\"中央氣象署 API 回傳 HTTP 錯誤碼 {status_code}。\"\n        ) from exc\n    except requests.exceptions.RequestException as exc:\n        raise WeatherAPIError(\n            f\"無法連線至中央氣象署 API：{type(exc).__name__}，請確認網路連線。\"\n        ) from exc\n\n    try:\n        data: Dict[str, Any] = response.json()\n    except ValueError as exc:\n        raise WeatherAPIError(\"中央氣象署 API 回應內容非合法的 JSON 格式。\") from exc\n\n    # CWA APIs usually include a 'success' field ('true' or True)\n    success = str(data.get(\"success\", \"\")).lower()\n    if success not in (\"true\", \"1\"):\n        msg = data.get(\"message\") or \"API 回應指出查詢未成功\"\n        raise WeatherAPIError(f\"中央氣象署 API 錯誤：{msg}\")\n\n    return data\n\n\ndef get_observation_data(\n    location_name: Optional[str] = None,\n    api_key: Optional[str] = None,\n) -> Dict[str, Any]:\n    \"\"\"Helper to fetch real-time station observation data (O-A0003-001).\"\"\"\n    return get_weather_data(\n        dataset_id=config.DATASET_OBSERVATION,\n        location_name=location_name,\n        api_key=api_key,\n    )\n\n\ndef get_forecast_data(\n    location_name: Optional[str] = None,\n    api_key: Optional[str] = None,\n) -> Dict[str, Any]:\n    \"\"\"Helper to fetch 36-hour general weather forecast (F-C0032-001).\"\"\"\n    return get_weather_data(\n        dataset_id=config.DATASET_FORECAST,\n        location_name=location_name,\n        api_key=api_key,\n    )\n" };

    stlite.mount(
      {

        ],

    );
